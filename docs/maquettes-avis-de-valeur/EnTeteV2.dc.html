<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap"><style>:root{--accent:#14AED6;--accent-2:#1F6FB5;--logo:repeating-linear-gradient(135deg,rgba(61,90,128,.16) 0 4px,rgba(61,90,128,.05) 4px 8px)}</style></helmet>
<div style="height:72px;box-sizing:border-box;padding:22px 40px 0;display:flex;flex-direction:column;gap:10px;flex:none;font-family:'Open Sans',system-ui,sans-serif">
  <div style="display:flex;align-items:center;gap:16px">
    <div style="display:flex;gap:9px;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.01em"><span style="font-weight:700;color:var(--accent)">{{ bold }}</span><span style="font-weight:300;color:var(--accent-2)">{{ light }}</span></div>
    <div style="margin-left:auto;width:84px;height:26px;border-radius:4px;background:var(--logo);display:flex;align-items:center;justify-content:center;font:500 8px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#3D5A80;flex:none">LOGO</div>
  </div>
  <div style="display:flex;align-items:center"><div style="width:160px;height:4px;background:var(--accent)"></div><div style="flex:1;height:1px;background:var(--accent);opacity:.35"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1123,&quot;height&quot;:72},&quot;bold&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Les prix&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;light&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;dans votre quartier&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
