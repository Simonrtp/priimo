<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"><style>:root{--accent:#E8743C;--logo:repeating-linear-gradient(135deg,rgba(61,90,128,.16) 0 4px,rgba(61,90,128,.05) 4px 8px)}</style></helmet>
<div style="height:68px;box-sizing:border-box;padding:24px 40px 0;display:flex;align-items:flex-start;gap:16px;flex:none;font-family:Inter,system-ui,sans-serif;color:#0A0D11">
  <div style="width:84px;height:28px;border-radius:5px;background:var(--logo);display:flex;align-items:center;justify-content:center;font:500 8px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#3D5A80;flex:none">LOGO</div>
  <div style="width:1px;height:28px;background:rgba(61,90,128,.2);flex:none"></div>
  <div style="display:flex;flex-direction:column;gap:8px;padding-top:3px">
    <div style="font-size:21px;font-weight:600;letter-spacing:-.015em;line-height:1">{{ title }}</div>
    <div style="width:28px;height:3px;border-radius:2px;background:var(--accent)"></div>
  </div>
  <div style="margin-left:auto;font-size:11px;color:#3D5A80;padding-top:8px;letter-spacing:.02em">Avis de valeur</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1123,&quot;height&quot;:68},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Votre bien&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
