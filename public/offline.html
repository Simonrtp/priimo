<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E8743C" />
    <title>Hors ligne · Priimo</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: #fff7f0;
        color: #15202f;
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        text-align: center;
      }
      .card {
        max-width: 26rem;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 24px 0 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 12px 0 0;
        font-size: 15px;
        line-height: 1.6;
        color: #4a5b6e;
      }
      button {
        margin-top: 28px;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 16px;
        background-color: #e8743c;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background-color: #d9652e;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>Pas de connexion</h1>
      <p>
        Priimo affiche toujours des données à jour : plutôt que de vous montrer une version
        périmée de vos leads, nous préférons attendre le retour du réseau.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
